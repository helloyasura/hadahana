name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: hadahana-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Production build (basePath /hadahana)
        env:
          NEXT_PUBLIC_BASE_PATH: /hadahana
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
