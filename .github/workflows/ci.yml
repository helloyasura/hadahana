name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: hadahana-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Deployment failure / rollback regression tests
        run: bash scripts/verify-deploy.sh
      - name: Unit and naming regression tests (no external AI)
        env:
          OPENAI_API_KEY: ""
          NAME_FEEDBACK_DB_PATH: ${{ runner.temp }}/hadahana-name-feedback.json
        run: npm test
      - name: Synthetic Pro OTP / tenant isolation / sharing UI
        env:
          PRO_SCREENSHOTS_DIR: ${{ runner.temp }}/jyotisha-pro-shots
        run: npm run test:pro:ui
      - name: Synthetic Pro visual studio / controls / references UI
        env:
          PRO_SCREENSHOTS_DIR: ${{ runner.temp }}/jyotisha-pro-shots
        run: npm run test:pro:studio:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jyotisha-pro-synthetic-screenshots
          path: ${{ runner.temp }}/jyotisha-pro-shots
          if-no-files-found: ignore
      - name: Production build (basePath /hadahana)
        env:
          NEXT_PUBLIC_BASE_PATH: /hadahana
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  pdf-image:
    name: Docker image / Sinhala PDF smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build baseline and PDF images (no publishing or deployment)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/hadahana-pdf-base "$BASE_SHA"
          docker build --build-arg NEXT_PUBLIC_BASE_PATH=/hadahana -t hadahana:pdf-base /tmp/hadahana-pdf-base
          docker build --build-arg NEXT_PUBLIC_BASE_PATH=/hadahana -t hadahana:pdf-pr .
          before=$(docker image inspect hadahana:pdf-base --format '{{.Size}}')
          after=$(docker image inspect hadahana:pdf-pr --format '{{.Size}}')
          echo "### Server PDF image budget" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline image: $before bytes; PDF image: $after bytes; delta: $((after-before)) bytes (uncompressed local image sizes)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Offline PDF smoke under container resource caps
        run: |
          timeout 60s docker run --rm --network=none --memory=768m --memory-swap=768m --cpus=0.5 --pids-limit=128 --entrypoint node hadahana:pdf-pr -e '
            const assert = require("node:assert/strict");
            const { execFileSync } = require("node:child_process");
            const { chromium } = require("playwright-core");
            (async () => {
              const font = execFileSync("fc-match", ["-f", "%{family}", "Noto Sans Sinhala"]).toString();
              assert.match(font, /Noto Sans Sinhala/);
              const browser = await chromium.launch({executablePath:process.env.CHROMIUM_PATH,timeout:15000,args:["--no-sandbox","--disable-dev-shm-usage","--disable-gpu","--renderer-process-limit=1","--js-flags=--max-old-space-size=128"]});
              try {
                const context = await browser.newContext({javaScriptEnabled:false,offline:true});
                await context.route("**/*", r => r.abort());
                const page = await context.newPage();
                await page.setContent("<style>@page{size:A5}body{font-family:Noto Sans Sinhala}</style><h1>ශ්‍රී චන්ද්‍ර ප්‍රඥා</h1>");
                await page.evaluate(() => document.fonts.ready);
                const pdf = await page.pdf({preferCSSPageSize:true});
                assert.equal(pdf.subarray(0,5).toString(), "%PDF-");
                const fs = require("node:fs");
                fs.writeFileSync("/tmp/case-document.pdf", pdf);
                execFileSync("/bin/sh", ["-c", "ulimit -v 262144; exec \"$@\"", "pdf-limit", "pdftoppm", "-f", "1", "-l", "1", "-scale-to", "800", "-png", "-singlefile", "/tmp/case-document.pdf", "/tmp/case-page"], {timeout:8000});
                assert.equal(fs.readFileSync("/tmp/case-page.png").subarray(1,4).toString(), "PNG");
                assert.equal((await require("sharp")(fs.readFileSync("/tmp/case-page.png")).metadata()).format, "png");
                console.log("Non-root, offline, capped Chromium/Sinhala PDF and Poppler/Sharp case preview passed:", pdf.length, "bytes");
              } finally { await browser.close(); }
            })().catch(error => {console.error(error);process.exitCode=1;});'
      - name: Production Compose startup and root-owned feedback volume migration smoke
        run: |
          project="hadahana-feedback-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${project}_handahana_data"
          docker volume create "$volume" >/dev/null
          export HANDAHANA_IMAGE=hadahana:pdf-pr
          export HANDAHANA_PORT=14132
          export COMPOSE_PROJECT_NAME="$project"
          trap 'docker compose -p "$project" down --volumes' EXIT
          HANDAHANA_IMAGE=hadahana:pdf-pr docker compose -p "$project" config --quiet
          # Keep the simulated legacy volume nonempty: Docker copy-up refreshes
          # ownership of empty volumes from the fixed image before the next run.
          docker run --rm --network=none --user=0:0 -v "$volume:/var/lib/handahana" --entrypoint sh hadahana:pdf-pr -c 'printf preserved-legacy-data > /var/lib/handahana/legacy-fixture.txt && chown -R 0:0 /var/lib/handahana && chmod 755 /var/lib/handahana'
          docker run --rm --network=none -v "$volume:/var/lib/handahana" --entrypoint sh hadahana:pdf-pr -c 'test ! -w /var/lib/handahana'
          # Exercise the ACTUAL production service dependency, caps, hardening,
          # loopback networking, healthcheck and limits, not only docker run.
          docker compose -p "$project" up -d --no-build --wait --wait-timeout 180
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose -p "$project" ps -a -q handahana-data-init)")" = 0
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -p "$project" ps -q handahana-web)")" = healthy
          curl --fail --silent --location http://127.0.0.1:14132/hadahana >/dev/null
          docker run --rm --network=none --memory=128m --pids-limit=32 -v "$volume:/var/lib/handahana" --entrypoint node hadahana:pdf-pr -e '
            const fs=require("node:fs"), assert=require("node:assert/strict");
            assert.equal(process.getuid(),1001);
            assert.equal(fs.readFileSync("/var/lib/handahana/legacy-fixture.txt","utf8"),"preserved-legacy-data");
            fs.writeFileSync("/var/lib/handahana/test.tmp", "feedback");
            fs.renameSync("/var/lib/handahana/test.tmp", "/var/lib/handahana/test.json");
            assert.equal(fs.readFileSync("/var/lib/handahana/test.json","utf8"),"feedback");
            console.log("Existing root-owned volume repaired; non-root atomic feedback write passed.");'

  panchanga-tests:
    name: Panchanga / PDF regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      NEXT_TELEMETRY_DISABLED: "1"
      PANCHANGA_SHOTS_DIR: /tmp/panchanga-artifacts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Print fonts and PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core poppler-utils
      - name: Validate, render and inspect every paper size
        run: npm run test:panchanga
      - name: Mock-LUMS browser and security regression
        run: npm run test:panchanga:ui
      - name: Synthetic cases / consented documents / reviewed reports
        env:
          PRO_CASES_SHOTS_DIR: /tmp/panchanga-artifacts
        run: npm run test:pro:cases:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panchanga-pdf-evidence
          path: /tmp/panchanga-artifacts
