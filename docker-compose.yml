# Handahana Studio ONLY — project name `handahana`, path /opt/handahana.
# Does not start, stop, or reconfigure lums-docker, govflow, bizflow, or nginx.
#
#   cd /opt/handahana && docker compose up -d
#
# Host nginx (separate) proxies https://ervanta.com/hadahana → 127.0.0.1:4132

name: handahana

services:
  handahana-web:
    image: ${HANDAHANA_IMAGE:-hadahana:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/hadahana}
        CACHEBUST: ${CACHEBUST:-0}
    container_name: handahana-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/hadahana}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      NAME_FEEDBACK_DB_PATH: /var/lib/handahana/name-feedback.json
    volumes:
      - handahana_data:/var/lib/handahana
    ports:
      - "${HANDAHANA_BIND_ADDRESS:-127.0.0.1}:${HANDAHANA_PORT:-4132}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- \"http://127.0.0.1:3000$${NEXT_PUBLIC_BASE_PATH:-/hadahana}\" >/dev/null || wget -qO- \"http://127.0.0.1:3000$${NEXT_PUBLIC_BASE_PATH:-/hadahana}/\" >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  handahana_data:
