# Handahana Studio ONLY — project name `handahana`, path /opt/handahana.
# Does not start, stop, or reconfigure lums-docker, govflow, bizflow, or nginx.
#
#   cd /opt/handahana && docker compose up -d
#
# Host nginx (separate) proxies https://ervanta.com/hadahana → 127.0.0.1:4132
#
# Uses host networking (like lums-docker): on the shared droplet docker-proxy
# published ports return empty replies, so Next.js binds directly to
# ${HANDAHANA_BIND_ADDRESS}:${HANDAHANA_PORT} on the host (loopback only).

name: handahana

services:
  handahana-web:
    image: ${HANDAHANA_IMAGE:-hadahana:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/hadahana}
        CACHEBUST: ${CACHEBUST:-0}
    container_name: handahana-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${HANDAHANA_PORT:-4132}
      HOSTNAME: ${HANDAHANA_BIND_ADDRESS:-127.0.0.1}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/hadahana}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LUMS_API_URL: ${LUMS_API_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      NAME_FEEDBACK_DB_PATH: /var/lib/handahana/name-feedback.json
    volumes:
      - handahana_data:/var/lib/handahana
    # Protect the other apps on the shared 2 GiB droplet. Benchmark before rollout.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.50
    pids_limit: 128
    network_mode: host
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- \"http://$${HOSTNAME:-127.0.0.1}:$${PORT:-4132}$${NEXT_PUBLIC_BASE_PATH:-/hadahana}\" >/dev/null || wget -qO- \"http://$${HOSTNAME:-127.0.0.1}:$${PORT:-4132}$${NEXT_PUBLIC_BASE_PATH:-/hadahana}/\" >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  handahana_data:
